name: Publish verified game content

on:
  workflow_dispatch:
    inputs:
      version:
        description: Content version, for example 0.2.0
        required: true
      min_app_version_code:
        description: Minimum supported APK versionCode
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: frost-story-content-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Package and hash content
        run: bash tools/package_content_update.sh "${{ inputs.version }}" "${{ inputs.min_app_version_code }}"
      - name: Create immutable prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "content-v${{ inputs.version }}" \
            "distribution/FrostStory-content-${{ inputs.version }}.zip" \
            "distribution/FrostStory-content-${{ inputs.version }}.zip.sha256" \
            --prerelease --title "Content ${{ inputs.version }}" \
            --notes "Verified dynamic content package. The signed Android app checks HTTPS, size, SHA-256 and ZIP paths before activation."
      - name: Publish manifest only after the asset exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/content-manifest.json
          git commit -m "content: publish ${{ inputs.version }} manifest"
          git push origin HEAD:main
