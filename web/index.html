<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e2a47" />
  <title>冰霜物语 Frost Story</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- WebGL 游戏层 -->
    <div id="stage">
      <div id="board"></div>
    </div>

    <!-- HTML UI 叠加层 -->
    <div id="ui" class="hidden">
      <header id="hud">
        <div class="hud-left">
          <div class="level-badge" id="levelBadge">
            <span class="lv-num">1</span>
            <div class="xp-wrap"><div class="xp-bar" id="xpBar"></div></div>
          </div>
          <div class="res energy" title="体力">
            <span class="ic ic-energy"></span>
            <b id="energyVal">50</b>
            <span class="timer" id="energyTimer"></span>
            <button class="plus" id="energyPlus">＋</button>
          </div>
        </div>
        <div class="hud-right">
          <div class="res coin"><span class="ic ic-coin"></span><b id="coinVal">0</b></div>
          <div class="res gem"><span class="ic ic-gem"></span><b id="gemVal">0</b></div>
          <div class="res warmth"><span class="ic ic-warmth"></span><b id="warmthVal">0</b></div>
        </div>
      </header>

      <div id="orders" class="orders"></div>

      <div id="hint" class="hint hidden"></div>

      <!-- 首次游玩逐步引导：遮罩不拦截目标操作，规则可随时回看 -->
      <div id="guideLayer" class="guide-layer hidden" aria-live="polite"></div>

      <!-- 爽玩模式悬浮控制台入口（开启后出现） -->
      <button id="sbFab" class="sb-fab hidden" type="button" aria-label="爽玩控制台，可拖动并自动吸附屏幕边缘" title="拖动可调整位置">🥽<span>爽玩</span></button>

      <footer id="dock">
        <button class="dock-btn" data-panel="shop"><span class="d-ic">🛒</span>商店</button>
        <button class="dock-btn" data-panel="book"><span class="d-ic">📖</span>图鉴</button>
        <button class="dock-btn" data-panel="story"><span class="d-ic">🏘️</span>山谷</button>
        <button class="dock-btn" data-panel="settings"><span class="d-ic">⚙️</span>设置</button>
      </footer>
    </div>

    <!-- 物品操作气泡 -->
    <div id="itemPop" class="item-pop hidden">
      <div class="ip-name" id="ipName"></div>
      <div class="ip-sub" id="ipSub"></div>
      <div class="ip-actions">
        <button id="ipSell" class="ip-btn sell">出售 <b id="ipPrice"></b></button>
      </div>
    </div>

    <!-- 通用弹窗容器 -->
    <div id="modalLayer"></div>
    <div id="toastLayer"></div>

    <!-- 加载/开场 -->
    <div id="loading">
      <div class="load-card">
        <img src="assets/img/title_keyart.png" alt="" class="load-art" />
        <h1 class="game-title">冰霜物语</h1>
        <p class="game-sub">FROST STORY · 合并 · 重建 · 温暖山谷</p>
        <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
        <p class="load-tip" id="loadTip">正在唤醒沉睡的霜语谷…</p>
      </div>
    </div>
  </div>

  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/pixi-unsafe-eval.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
